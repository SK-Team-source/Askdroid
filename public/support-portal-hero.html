<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Portal Hero</title>
<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
background:radial-gradient(circle at center,#081225,#020617 75%);
}
canvas{display:block;}
</style>
</head>
<body>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
2000
);
camera.position.z = 120;

const renderer = new THREE.WebGLRenderer({
antialias:true
});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const world = new THREE.Group();
scene.add(world);

// Portal particles
const particleCount = 2500;
const positions = new Float32Array(particleCount * 3);

for(let i=0;i<particleCount;i++){

const angle = Math.random() * Math.PI * 2;
const radius = 28 + Math.random() * 8;

positions[i*3] = Math.cos(angle) * radius;
positions[i*3+1] = Math.sin(angle) * radius;
positions[i*3+2] = (Math.random()-0.5) * 10;
}

const portalGeo = new THREE.BufferGeometry();
portalGeo.setAttribute(
'position',
new THREE.BufferAttribute(positions,3)
);

const portal = new THREE.Points(
portalGeo,
new THREE.PointsMaterial({
color:'#67E8F9',
size:1.2,
transparent:true,
opacity:0.85
})
);

world.add(portal);

// Floating particles
const starGeo = new THREE.BufferGeometry();
const starCount = 1800;
const starPos = new Float32Array(starCount*3);

for(let i=0;i<starCount;i++){
starPos[i*3]=(Math.random()-0.5)*400;
starPos[i*3+1]=(Math.random()-0.5)*250;
starPos[i*3+2]=(Math.random()-0.5)*300;
}

starGeo.setAttribute(
'position',
new THREE.BufferAttribute(starPos,3)
);

const stars = new THREE.Points(
starGeo,
new THREE.PointsMaterial({
size:0.8,
color:'#ffffff',
transparent:true,
opacity:0.5
})
);

world.add(stars);

// Energy Rings
const rings=[];

for(let i=0;i<4;i++){

const ring = new THREE.Mesh(
new THREE.RingGeometry(34+i*6,34.5+i*6,128),
new THREE.MeshBasicMaterial({
color:0x00d4ff,
transparent:true,
opacity:0.18,
side:THREE.DoubleSide
})
);

world.add(ring);
rings.push(ring);
}

// Information Streams
const streams=[];

for(let i=0;i<40;i++){

const particle = new THREE.Mesh(
new THREE.SphereGeometry(0.7,8,8),
new THREE.MeshBasicMaterial({color:0xffffff})
);

particle.userData={
angle:Math.random()*Math.PI*2,
speed:0.004+Math.random()*0.005
};

world.add(particle);
streams.push(particle);
}

let mouseX=0;
let mouseY=0;

window.addEventListener('mousemove',(e)=>{
mouseX=(e.clientX/window.innerWidth)-0.5;
mouseY=(e.clientY/window.innerHeight)-0.5;
});

window.addEventListener('click',()=>{
rings.forEach(r=>{
r.scale.set(0.4,0.4,0.4);
});
});

window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

function animate(time){

requestAnimationFrame(animate);

world.rotation.y += ((mouseX*0.4)-world.rotation.y)*0.03;
world.rotation.x += ((-mouseY*0.2)-world.rotation.x)*0.03;

// Portal breathing
const pulse = 1 + Math.sin(time*0.0015)*0.06;
portal.scale.set(pulse,pulse,pulse);

// Orbiting streams
streams.forEach((s,index)=>{

s.userData.angle += s.userData.speed;

const r = 32 + (index%5)*4;

s.position.x = Math.cos(s.userData.angle)*r;
s.position.y = Math.sin(s.userData.angle)*r;
s.position.z = Math.sin(time*0.001+index)*10;

});

// Energy waves
rings.forEach((ring,index)=>{

const v = (Math.sin(time*0.001+index)+1)/2;

ring.scale.x += ((1+v*2)-ring.scale.x)*0.04;
ring.scale.y += ((1+v*2)-ring.scale.y)*0.04;

ring.material.opacity = 0.2 - (v*0.15);

});

portal.rotation.z += 0.0015;
stars.rotation.y += 0.0002;

renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
