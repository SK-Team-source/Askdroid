<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast Wave Hero</title>
<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
background:radial-gradient(circle at center,#081225,#020617 75%);
}
canvas{display:block;}
</style>
</head>
<body>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
2000
);
camera.position.z = 120;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const world = new THREE.Group();
scene.add(world);

// Audio Waveform Particles
const waveCount = 2500;
const positions = new Float32Array(waveCount*3);

for(let i=0;i<waveCount;i++){

const x = (i-waveCount/2)*0.08;
const y = Math.sin(i*0.03)*12;
const z = (Math.random()-0.5)*20;

positions[i*3]=x;
positions[i*3+1]=y;
positions[i*3+2]=z;
}

const waveGeo = new THREE.BufferGeometry();
waveGeo.setAttribute(
'position',
new THREE.BufferAttribute(positions,3)
);

const waveform = new THREE.Points(
waveGeo,
new THREE.PointsMaterial({
color:'#67E8F9',
size:1.3,
transparent:true,
opacity:0.9
})
);

world.add(waveform);

// Floating Voice Nodes
const nodes=[];

for(let i=0;i<30;i++){

const node=new THREE.Mesh(
new THREE.SphereGeometry(1.5,16,16),
new THREE.MeshBasicMaterial({
color:i%4===0?0xffffff:0x8B5CF6
})
);

node.position.set(
(Math.random()-0.5)*180,
(Math.random()-0.5)*80,
(Math.random()-0.5)*80
);

node.userData={
offset:Math.random()*10
};

world.add(node);
nodes.push(node);
}

// Broadcast Rings
const rings=[];

for(let i=0;i<5;i++){

const ring=new THREE.Mesh(
new THREE.RingGeometry(18+i*10,18.6+i*10,128),
new THREE.MeshBasicMaterial({
color:0x00d4ff,
transparent:true,
opacity:0.18,
side:THREE.DoubleSide
})
);

ring.rotation.x=Math.PI/2;

world.add(ring);
rings.push(ring);
}

// Pulse Particles
const pulses=[];

for(let i=0;i<60;i++){

const pulse=new THREE.Mesh(
new THREE.SphereGeometry(0.5,8,8),
new THREE.MeshBasicMaterial({color:0xffffff})
);

pulse.userData={
angle:Math.random()*Math.PI*2,
radius:20+Math.random()*40,
speed:0.005+Math.random()*0.004
};

world.add(pulse);
pulses.push(pulse);
}

// Background Stars
const starGeo = new THREE.BufferGeometry();
const starCount = 1800;
const starPos = new Float32Array(starCount*3);

for(let i=0;i<starCount;i++){
starPos[i*3]=(Math.random()-0.5)*500;
starPos[i*3+1]=(Math.random()-0.5)*300;
starPos[i*3+2]=(Math.random()-0.5)*400;
}

starGeo.setAttribute(
'position',
new THREE.BufferAttribute(starPos,3)
);

const stars = new THREE.Points(
starGeo,
new THREE.PointsMaterial({
color:'#ffffff',
size:0.8,
transparent:true,
opacity:0.5
})
);

world.add(stars);

let mouseX=0;
let mouseY=0;

window.addEventListener('mousemove',(e)=>{
mouseX=(e.clientX/window.innerWidth)-0.5;
mouseY=(e.clientY/window.innerHeight)-0.5;
});

window.addEventListener('click',()=>{
rings.forEach(r=>{
r.scale.set(0.4,0.4,0.4);
});
});

window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

function animate(time){

requestAnimationFrame(animate);

world.rotation.y += ((mouseX*0.35)-world.rotation.y)*0.03;
world.rotation.x += ((-mouseY*0.15)-world.rotation.x)*0.03;

// Waveform Animation
const pos = waveform.geometry.attributes.position.array;

for(let i=0;i<waveCount;i++){

const x = pos[i*3];

pos[i*3+1] =
Math.sin(x*0.08 + time*0.002)*12 +
Math.sin(x*0.02 + time*0.001)*8;

}

waveform.geometry.attributes.position.needsUpdate=true;

// Voice Nodes
nodes.forEach((node,index)=>{

const s=1+Math.sin(time*0.002+node.userData.offset)*0.4;
node.scale.set(s,s,s);

node.position.y += Math.sin(time*0.001+index)*0.02;

});

// Broadcast Rings
rings.forEach((ring,index)=>{

const v=(Math.sin(time*0.001+index)+1)/2;

ring.scale.x += ((1+v*3)-ring.scale.x)*0.03;
ring.scale.y += ((1+v*3)-ring.scale.y)*0.03;

ring.material.opacity=0.25-v*0.2;

});

// Audio Pulses
pulses.forEach(p=>{

p.userData.angle += p.userData.speed;

p.position.x=Math.cos(p.userData.angle)*p.userData.radius;
p.position.y=Math.sin(p.userData.angle*2)*15;
p.position.z=Math.sin(p.userData.angle)*p.userData.radius*0.5;

});

stars.rotation.y += 0.0002;

renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
